name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and build
        run: npm run check

      - name: SSR HTML smoke (without database secrets)
        run: node scripts/check-ssr-html.mjs

      - name: Verify optional Nhân Hòa standalone build
        run: |
          DEPLOY_STANDALONE=1 npm run build
          test -f .next/standalone/server.js
