  <path d="M27 49H85" stroke="#F9C84B" stroke-width="2.4" stroke-linecap="round" />

  <!-- Golden Heart / Warmth Emblem in Center of Home -->
  <path d="M56 69C56 69 45 61.8 45 55.2C45 51.4 48 48.8 51.5 48.8C53.7 48.8 55.2 50 56 51.5C56.8 50 58.3 48.8 60.5 48.8C64 48.8 67 51.4 67 55.2C67 61.8 56 69 56 69Z" fill="url(#honeyDrop)" stroke="#7A563B" stroke-width="2" stroke-linejoin="round" />

  <!-- Open Keepsake Book Pages at Base -->
  <path d="M24 85C35 81 46 82 56 86C66 82 77 81 88 85" stroke="#7A563B" stroke-width="2.4" stroke-linecap="round" fill="none" />
  <path d="M28 90C37 86.8 47 87.5 56 91C65 87.5 75 86.8 84 90" stroke="#C69C6D" stroke-width="1.8" stroke-linecap="round" fill="none" />
