<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" fill="none">
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8EA" />
      <stop offset="1" stop-color="#FDE5A8" />
    </linearGradient>
    <linearGradient id="fur" x1="30" y1="24" x2="82" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAD46B" />
      <stop offset="1" stop-color="#F2B830" />
    </linearGradient>
    <linearGradient id="shirt" x1="34" y1="68" x2="78" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E45E5A" />
      <stop offset="1" stop-color="#C94440" />
    </linearGradient>
  </defs>
  <!-- Warm rounded badge frame -->
  <rect x="6" y="6" width="100" height="100" rx="28" fill="url(#bg)" stroke="#E5C595" stroke-width="3" />
  <!-- Cozy roof accent -->
  <path d="M22 34 L56 14 L90 34" stroke="#D9534F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bear Ears -->
  <circle cx="35" cy="37" r="11" fill="url(#fur)" stroke="#8B6A4E" stroke-width="3" />
  <circle cx="35" cy="37" r="5.5" fill="#E9A825" />
  <circle cx="77" cy="37" r="11" fill="url(#fur)" stroke="#8B6A4E" stroke-width="3" />
  <circle cx="77" cy="37" r="5.5" fill="#E9A825" />
  <!-- Red Shirt / Body -->
  <path d="M31 86 C31 71 42 66 56 66 C70 66 81 71 81 86 L83 95 C83 98 80 100 76 100 L36 100 C32 100 29 98 29 95 Z" fill="url(#shirt)" stroke="#8B6A4E" stroke-width="3" stroke-linejoin="round" />
  <!-- Collar -->
  <path d="M44 68 Q56 75 68 68" stroke="#FFF4E0" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Bear Head -->
  <ellipse cx="56" cy="53" rx="24" ry="21" fill="url(#fur)" stroke="#8B6A4E" stroke-width="3" />
  <!-- Cheeks -->
  <ellipse cx="40" cy="57" rx="4.5" ry="2.8" fill="#F08C7E" opacity="0.65" />
  <ellipse cx="72" cy="57" rx="4.5" ry="2.8" fill="#F08C7E" opacity="0.65" />
  <!-- Snout -->
  <ellipse cx="56" cy="57.5" rx="9.5" ry="7.5" fill="#FFF4E0" />
  <!-- Nose & Smile -->
  <ellipse cx="56" cy="54.5" rx="4.2" ry="3" fill="#634832" />
  <path d="M51.5 59.5 Q56 63.5 60.5 59.5" stroke="#634832" stroke-width="2.4" stroke-linecap="round" fill="none" />
  <!-- Eyes -->
  <circle cx="45.5" cy="49.5" r="2.8" fill="#4A3525" />
  <circle cx="46.3" cy="48.6" r="0.9" fill="#FFFFFF" />
  <circle cx="66.5" cy="49.5" r="2.8" fill="#4A3525" />
  <circle cx="67.3" cy="48.6" r="0.9" fill="#FFFFFF" />
  <!-- Cute little honey drop / heart on shirt -->
  <path d="M56 80 C56 80 50 75 50 78.5 C50 81.5 56 85.5 56 85.5 C56 85.5 62 81.5 62 78.5 C62 75 56 80 56 80 Z" fill="#F9C84B" />
