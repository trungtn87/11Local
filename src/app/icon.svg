  </defs>

  <!-- Refined Archival Crest Frame -->
  <rect x="6" y="6" width="100" height="100" rx="26" fill="url(#emblemBg)" stroke="#C69C6D" stroke-width="2.4" />
  <rect x="12" y="12" width="88" height="88" rx="20" stroke="#E4CCB0" stroke-width="1.2" />

  <!-- Subtle Bear Ear Silhouette integrated behind the Roof (Minimalist Monogram) -->
  <circle cx="33" cy="34" r="9.5" fill="#F9C84B" stroke="#7A563B" stroke-width="2.2" />
  <circle cx="33" cy="34" r="4.2" fill="#DC9B22" opacity="0.55" />
  <circle cx="79" cy="34" r="9.5" fill="#F9C84B" stroke="#7A563B" stroke-width="2.2" />
  <circle cx="79" cy="34" r="4.2" fill="#DC9B22" opacity="0.55" />

  <!-- Architectural Cottage & Open Family Album Pages -->
  <path d="M28 46V80C28 82.2 29.8 84 32 84H80C82.2 84 84 82.2 84 80V46" fill="#FFFDF9" stroke="#7A563B" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Gable Roof (Soft Red) -->
