<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" fill="none">
  <defs>
    <linearGradient id="emblemBg" x1="12" y1="8" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9" />
      <stop offset="1" stop-color="#F6E5C6" />
    </linearGradient>
    <linearGradient id="roofWarm" x1="22" y1="22" x2="90" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9534F" />
      <stop offset="1" stop-color="#B83E3A" />
    </linearGradient>
    <linearGradient id="honeyDrop" x1="56" y1="54" x2="56" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAD461" />
      <stop offset="1" stop-color="#E4A224" />
